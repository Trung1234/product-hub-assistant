services:
  - type: web
    name: printway-product-hub-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /ok
    envVars:
      - key: PORT
        value: 2024
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        value: https://cvhjqjttdupchyjwfgyq.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BROWSERLESS_API_KEY
        sync: false
      - key: BROWSERLESS_USE_RESIDENTIAL
        value: "true"
      - key: BROWSERLESS_WS_ENDPOINT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
