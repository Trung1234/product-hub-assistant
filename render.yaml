services:
  - type: web
    name: printway-product-hub-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /ok
    autoDeploy: true
    envVars:
      - key: OPENAI_API_BASE
        value: https://9router.printway.io/v1
      - key: MODEL_NAME
        value: cx/gpt-5.5
      - key: FALLBACK_OPENAI_API_BASE
        value: https://api.vilao.ai/v1
      - key: FALLBACK_MODEL_NAME
        value: occ/claude-sonnet-4-6
      - key: OPENAI_API_KEY
        sync: false
      - key: FALLBACK_OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
